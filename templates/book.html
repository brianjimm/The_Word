{% extends "base.html" %}
{% block title %}{{ book_name }} — Scripture{% endblock %}

{% block crumbs %}
<nav class="crumbs"><a href="/">Books</a> / {{ book_name }}</nav>
{% endblock %}

{% block content %}
<style>
  .book-heading {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2rem;
    text-align: center;
    margin: 1rem 0 1.6rem;
    color: var(--ink);
  }

  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 0.5rem;
  }

  .chapter-tile {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    text-align: center;
    padding: 0.7rem 0.2rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
    transition: all 0.15s ease;
  }

  .chapter-tile:hover {
    border-color: var(--rubric);
    color: var(--rubric);
  }
</style>

<h1 class="book-heading">{{ book_name }}</h1>

<div class="chapter-grid">
  {% for c in range(1, chapter_count + 1) %}
  <a class="chapter-tile" href="/book/{{ book_name | urlencode }}/{{ c }}">{{ c }}</a>
  {% endfor %}
</div>
{% endblock %}
