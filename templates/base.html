<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Scripture{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f0e6;
    --paper-deep: #ece3d3;
    --ink: #2b2620;
    --ink-soft: #5c5344;
    --rubric: #a3352b;
    --rubric-soft: #c17a6f;
    --rule: #d8cbb0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }

  .site-header {
    border-bottom: 3px double var(--rubric);
    padding: 1.4rem 1.5rem 1.1rem;
    text-align: center;
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .site-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.7rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    display: block;
  }

  .site-title .rubric-dot {
    color: var(--rubric);
  }

  .site-tagline {
    font-family: 'Jost', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 0.3rem;
  }

  nav.crumbs {
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    max-width: 760px;
    margin: 1.1rem auto 0;
    padding: 0 1.5rem;
  } 

nav.crumbs a { color: var(--rubric); }
  nav.crumbs a:hover { text-decoration: underline; }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.2rem 1.5rem 4rem;
  }

  .search-box {
    max-width: 760px;
    margin: 1.3rem auto 0;
    padding: 0 1.5rem;
  }

  .search-box form {
    display: flex;
    gap: 0.5rem;
  }

  .search-box input[type="text"] {
    flex: 1;
    font-family: 'Source Serif 4', serif;
    font-size: 1rem;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }

  .search-box input[type="text"]:focus {
    outline: 2px solid var(--rubric-soft);
    outline-offset: 1px;
  }

  .search-box button {
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--rubric);
    color: var(--paper);
    border: none;
    padding: 0.6rem 1.3rem;
    border-radius: 3px;
    cursor: pointer;
  }

  .search-box button:hover { background: #872a22; }

  footer {
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    padding: 2rem 1.5rem 3rem;
  }

  ::selection { background: var(--rubric-soft); color: #fff; }

  @media (max-width: 480px) {
    .site-title { font-size: 1.4rem; }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="site-header">
  <a href="/" style="display:inline-block;">
    <span class="site-title">Scripture<span class="rubric-dot">.</span></span>
    <span class="site-tagline">World English Bible</span>
  </a>
</header>

<div class="search-box">
  <form action="/search" method="get">
    <input type="text" name="q" placeholder="Search a reference — e.g. John 3:16, Psalm 23" value="{{ request.args.get('q', '') }}" autocomplete="off">
    <button type="submit">Find</button>
  </form>
</div>

{% block crumbs %}{% endblock %}

<main>
{% block content %}{% endblock %}
</main>

<footer>
  World English Bible — public domain, freely shared &middot; text via bible-api.com
</footer>

</body>
</html>
