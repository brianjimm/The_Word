<!DOCTYPE html>
<html lang="{{ lang_cfg.html_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ t('title_suffix') }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600{% if lang == 'zh' %}&family=Noto+Serif+SC:wght@400;600{% elif lang == 'hi' %}&family=Noto+Serif+Devanagari:wght@400;600{% endif %}&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f0e6;
    --paper-deep: #ece3d3;
    --ink: #2b2620;
    --ink-soft: #5c5344;
    --rubric: #a3352b;
    --rubric-soft: #c17a6f;
    --rule: #d8cbb0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }

  .site-header {
    border-bottom: 3px double var(--rubric);
    padding: 1.4rem 1.5rem 1.1rem;
    text-align: center;
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .site-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.7rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    display: block;
  }

  .site-title .rubric-dot {
    color: var(--rubric);
  }

  .site-tagline {
    font-family: 'Jost', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 0.3rem;
  }

  nav.crumbs {
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    max-width: 760px;
    margin: 1.1rem auto 0;
    padding: 0 1.5rem;
  } 

nav.crumbs a { color: var(--rubric); }
  nav.crumbs a:hover { text-decoration: underline; }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 1.2rem 1.5rem 4rem;
  }

  .search-box {
    max-width: 760px;
    margin: 1.3rem auto 0;
    padding: 0 1.5rem;
  }

  .search-box form {
    display: flex;
    gap: 0.5rem;
  }

  .search-box input[type="text"] {
    flex: 1;
    font-family: 'Source Serif 4', serif;
    font-size: 1rem;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: #fffdf8;
    color: var(--ink);
  }

  .search-box input[type="text"]:focus {
    outline: 2px solid var(--rubric-soft);
    outline-offset: 1px;
  }

  .search-box button {
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--rubric);
    color: var(--paper);
    border: none;
    padding: 0.6rem 1.3rem;
    border-radius: 3px;
    cursor: pointer;
  }

  .search-box button:hover { background: #872a22; }

  footer {
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    padding: 2rem 1.5rem 3rem;
  }

  /* Language switcher */
  .lang-switch {
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    margin-top: 0.7rem;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.3rem 1rem;
  }
  .lang-switch a { color: var(--rubric); }
  .lang-switch a:hover { text-decoration: underline; }
  .lang-switch .current {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--rubric);
  }

  /* Chinese and Hindi: use a font with the right glyphs, and avoid letter-spacing
     (it breaks Devanagari conjuncts and looks wrong between CJK characters). */
  html[lang="zh-Hans"] body, html[lang="zh-Hans"] body * {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    letter-spacing: normal;
  }
  html[lang="hi"] body, html[lang="hi"] body * {
    font-family: 'Noto Serif Devanagari', 'Source Serif 4', serif;
    letter-spacing: normal;
    text-transform: none;
  }
  html[lang="zh-Hans"] body, html[lang="hi"] body { line-height: 1.8; }
  html[lang="zh-Hans"] .lang-switch a, html[lang="hi"] .lang-switch a,
  html[lang="zh-Hans"] .lang-switch .current, html[lang="hi"] .lang-switch .current {
    font-family: 'Source Serif 4', 'Noto Serif SC', 'Noto Serif Devanagari', serif;
  }

  ::selection { background: var(--rubric-soft); color: #fff; }

  @media (max-width: 480px) {
    .site-title { font-size: 1.4rem; }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="site-header">
  <a href="/" style="display:inline-block;">
    <span class="site-title">Scripture<span class="rubric-dot">.</span></span>
    <span class="site-tagline">{{ t('tagline') }}</span>
  </a>
  <nav class="lang-switch" aria-label="{{ t('language') }}">
    {% for code, cfg in languages.items() %}
      {% if code == lang %}<span class="current" aria-current="true">{{ cfg.native }}</span>{% else %}<a href="/set-language/{{ code }}?next={{ current_url | urlencode }}" lang="{{ cfg.html_lang }}" hreflang="{{ cfg.html_lang }}">{{ cfg.native }}</a>{% endif %}
    {% endfor %}
  </nav>
</header>

<div class="search-box">
  <form action="/search" method="get">
    <input type="text" name="q" placeholder="{{ t('search_placeholder') }}" value="{{ request.args.get('q', '') }}" autocomplete="off">
    <button type="submit">{{ t('find') }}</button>
  </form>
</div>

{% block crumbs %}{% endblock %}

<main>
{% block content %}{% endblock %}
</main>

<footer>
  {{ t('footer') }}
</footer>

</body>
</html>
